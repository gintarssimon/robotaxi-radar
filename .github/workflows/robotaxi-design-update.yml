# Robotaxi Radar: Design und detaillierte Karte, Version 2026-09-25.7
# Diese einzelne Datei in .github/workflows/ hochladen. Startet automatisch auf main.
# Keine neuen Zugangsdaten und kein kostenpflichtiger Kartendienst erforderlich.
name: Robotaxi Radar Design-Update
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/robotaxi-design-update.yml
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: robotaxi-radar-update
  cancel-in-progress: false
jobs:
  design:
    if: github.repository == 'gintarssimon/robotaxi-radar' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Vorhandenen Stand pruefen
      shell: bash
      run: |
        python3 - <<'PYTHON'
        from pathlib import Path
        import hashlib, json
        expected = {'public/index.html': {'before': 'bd4a984df9f3542f5c2d91d837289d892048868c4afe3098d5896a63f279814f', 'after': '9c10a27ab227403e458183d337da84a576ceeac097ac3065f2b57f83cadceb28'}, 'public/style.css': {'before': '4bbffeb83571a25c58bb90594bdee42c0f21d678bae626d1a0e7f0641fc502bd', 'after': 'c752a3f7223fb8c8f13bf5d9d84a383997f2ea31db8a9461a1ceca35005abb30'}, 'public/app.js': {'before': 'e2b2c099b743a5a0e029f46715dbb4a74171ce4fdbed24ae92d841cc6d498e45', 'after': '50a4689135d010cf46309d47e2287ec8b1ef1502a88db7c8932aefd0639dcfc1'}, 'public/map-view.js': {'before': None, 'after': '84ef023d6e884a5852478e9121e02156c2748cddad34d5a9fa4a1555626d91b6'}, 'firebase.json': {'before': '85410c9770c3e6834b004ff51b9588041fd204ba7953fc9557a45bad04ce365d', 'after': '39631a7b7e0c79d1e9168977fc9f361ca6da519a935eef9f07e1055d3193ff22'}, 'test/map-view.test.mjs': {'before': None, 'after': '69f5ee721129b42544c38171ef28f84dda39ff5ab41cf3bb88e4def38ab02c56'}}
        dependencies = {'public/model.js': '48f9949c2fc852c7f147ad34cb43d3f71312507a9cb8b2d08941e129b3ca0456', 'public/baseline.js': '7c683f795033e1e61a340d9d6eacd1f4fa3a69dc8502ce5e229f0b6f13f57d88', 'public/merge.js': '8c6192805c6f779305691f552ba58fc1f8c651e00d2f2f3c5da5eaba7a985fb6'}

        def digest(path):
            if path.is_symlink():
                raise SystemExit('Unerwartete Dateiverknuepfung: '+str(path))
            return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None

        for target, versions in expected.items():
            actual = digest(Path(target))
            if actual not in (versions['before'], versions['after']):
                raise SystemExit('Die Datei '+target+' wurde seit der Vorbereitung geaendert. Das Update wurde nicht angewendet; bitte den neuen Stand pruefen.')
        for target, checksum in dependencies.items():
            if digest(Path(target)) != checksum:
                raise SystemExit('Andere Datenlogik erkannt: '+target+'. Bitte dieses Design-Update zuerst an den neuen Stand anpassen.')
        assert Path('public/data/verified.json').is_file(), 'Der reparierte Grundbestand fehlt.'
        print('Vorhandene Version geprueft. Das Update ersetzt nur Design, Kartenmodul und zugehoerige Konfiguration.')
        PYTHON
