    - run: npm ci
    - name: Daten- und Kartentests ausfuehren
      run: npm test
    - name: Website vorbereiten
      run: npm run build
    - name: London-Eintraege und neue Karte pruefen
      shell: bash
      run: |
        node --input-type=module - <<'JS'
        import {readFileSync} from 'node:fs';
        import assert from 'node:assert/strict';
        import {applyBaseline} from './public/baseline.js';
        const read=path=>JSON.parse(readFileSync(path,'utf8'));
        const data=applyBaseline(read('public/data/snapshot.json'),read('public/data/verified.json'));
        for(const provider of ['Waymo','Uber','Lyft']) assert.ok(data.records.some(r=>r.cityKey==='london'&&r.provider===provider),'London fehlt: '+provider);
        assert.match(readFileSync('public/index.html','utf8'),/20260925-design7/);
        assert.match(readFileSync('public/map-view.js','utf8'),/tile.openstreetmap.org/);
        assert.match(readFileSync('firebase.json','utf8'),/https:\/\/tile.openstreetmap.org/);
        console.log('Design 2026-09-25.7 bereit. Alle drei London-Anbieter bleiben erhalten.');
        JS
    - name: Design im Repository speichern
      shell: bash
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add public/index.html public/style.css public/app.js public/map-view.js firebase.json test/map-view.test.mjs
        if ! git diff --cached --quiet; then
          git commit -m 'Verbessere Design und ergaenze detaillierte Robotaxi-Karte'
          git push origin HEAD:main
        fi
    - name: Neues Design auf Firebase veroeffentlichen
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROBOTAXIRADAR }}
        projectId: robotaxiradar
        channelId: live
    - name: Ergebnis anzeigen
      shell: bash
      run: |
